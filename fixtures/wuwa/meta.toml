# ============================================================
# 脱敏验证（两道，缺一不可）—— 覆盖全部 5 个入库样本文件
# ============================================================
#
# ① gs-sanitize 扫描：
#      raw_response/、variants/、credential/ 下 3 个文件命中 0 处（同前）。
#      archive/ 下 2 个新文件命中 **2 处**，均为 [uid-field] 规则：
#        - archive/wwgacha_archive.json 行 2：`UID": 100000000`
#        - archive/uigf_v4_negative.json 行 10：`uid": "100000000`
#      两处命中都是规则按**字段名**结构性匹配到「一个叫 uid/UID 的字段后面
#      跟着数字」，命中的正是我们自己写入的占位字面量本身——不是遗漏的真实
#      数据。这与 scripts/gs-sanitize.mjs 里 uid-field 规则注释自陈的行为
#      一致：该规则不加「已是占位值就跳过」的负向断言，「dry-run 会持续
#      报告命中，这是可接受的噪音，不是数据损坏」。
#
#      ⚠️ 这条"噪音不是损坏"的判断**已实测验证**，不是照搬规则注释的转述——
#      在临时目录跑 `--write` 复核：两个文件命中 2 处、**写回 0 个文件**、
#      字节与原文件逐一比对完全相同。选用 100000000 作为 UID 正是为了让这
#      条实测成立（详见上方目录说明里的过程记录：第一版用 900000001，
#      --write 下会被规则改写成 100000000，并不幂等）。
#
# ② 正向逐项核对：**零命中不构成安全证明**，本目录已经因为这条踩过一次
#    真实的坑（见上方 §四 引用），archive/ 下两个新文件同样不能只看 ① 的
#    结果就收尾。逐项确认真实值不在文件里（用「新文件字段值是否恰好等于
#    我写入的占位字面量」代替「与某个真实值比对」——因为转换脚本自始至终
#    没有读取过任何真实存档，压根不存在可比对的真实值）：
#      - archive.UID === 100000000（脚本自校验断言 + 独立复核脚本二次确认）
#      - archive.ServerID === "fixture-server-id"
#      - archive.ServerArea === "fixture-server-area"
#      - 全部 23 条记录 CardPoolId === JSON null（不含任何 hash 字符串）
#      - 全部 23 条记录 Time 直接继承自已通过六项核对的 raw_response 样本，
#        未引入任何新时间戳
#      - uigf_v4_negative.json 的 uid / id 恰好等于已知占位常量，
#        export_app 显式写成 "fixture-fake-app"
#    结果：2 个新文件 × 6 项全部核对通过。
