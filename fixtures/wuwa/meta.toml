# 鸣潮插件 fixture 元信息。
#
# ⚠️ **与 fixtures/genshin/ 的性质不同**：原神那套是手工构造、从未接触真实
# 账号数据；本目录的记录样本**裁自真实存档**（3371 条中选取 25 条），因此
# 脱敏不是走过场，零命中也不构成安全证明——见文末「脱敏验证」一节。

[game]
id = "wuwa"
displayName = "鸣潮"
apiVersionNote = """
raw_response/*.json 模拟的是 POST gmserver-api.aki-game2.com/gacha/record/query
的响应形状：{ code, message, data: [...] }，data 元素对齐 WWGachaExport 的
**Models/GachaAPI.cs 里的 KRAPIItem**（不是 Models/GachaData.cs）。
"""

# ============================================================
# ⚠️ 本目录的第一版建模错了，记在这里而不是悄悄改掉
# ============================================================
#
# 第一版 raw_response/*.json 是直接从本地存档裁样得来的，于是照抄了**存档**
# 的形状：PascalCase 字段名（`ResourceId`/`CardPoolType`/`Time`…），并且带了
# 一个 `CardPoolId` 字段。两处都错，同一个根因——**把本地存档格式当成了 API
# 响应格式**。这两者是不同的类型：
#
#   - API 响应元素 = `Models/GachaAPI.cs` 的 `KRAPIItem`，每个字段都带
#     `[JsonProperty("...")]` 注解，线上是 **camelCase**（`cardPoolType` /
#     `resourceId` / `qualityLevel` / `resourceType` / `name` / `count` / `time`），
#     **共 7 个字段，没有 `cardPoolId`**。
#   - 本地存档元素 = `Models/GachaData.cs` 的 `GachaData`，PascalCase，且**多出
#     一个 `CardPoolId`**——源码 `UpdateGachaDataDialogViewModel.cs:301` 是
#     `CardPoolId = cardPoolId`，赋的是从**请求 URL** 的 `resources_id` 参数
#     解析出来的局部变量，**不是响应里的字段**。
#
# 为什么这个错误值得留档：它不会被任何一道门拦住。字段名大小写错了，
# `extractRecord` 读到的全是 `undefined`，但 fixture 与插件如果“错得一致”，
# 契约测试照样全绿——而真实采集会产出一批空字段记录。这与本项目反复记录的
# 「门之所以通过，是因为它什么都没检查」是同一类，只是换到了 fixture 上：
# **fixture 建模错了，测试就在验证一个不存在的世界。**
#
# 发现路径：写插件的一方读 `Models/GachaAPI.cs` 源码后指出与 fixture 不符，
# 由主进程复核源码确认。再次印证本项目那条硬约束——**调研结论必须用参考项目
# 的真实源码校准**，这次被校准掉的是 fixture 本身。

[account]
# 本小节描述的是 `raw_response/` 与 `variants/`：那两处只保留记录数组，
# UID / ServerID / ServerArea 这些存档顶层字段整体未被裁入，所以「不适用」。
#
# ⚠️ **`archive/` 不在此列**（2026-08-13 随 M2-S6 加入后补正）：存档格式的
# 定义就包含账号级字段，剥掉它就不再是这个格式、适配器也无从解析。那三个
# 字段在 `archive/wwgacha_archive.json` 里确实存在，但**全部是脚本内硬编码
# 的字面占位值**（`100000000` / `"fixture-server-id"` / `"fixture-server-area"`），
# 不来自任何真实数据——详见本文件下方 `archive/` 目录说明与「脱敏验证」两节。
#
# 本行的取值只被 `assertPluginFixture` 读去构造 `hooks.resolveTimezone` 的
# 上下文（`packages/gs-plugin-kit/testkit/index.ts:321`）。鸣潮插件没有声明
# 该 hook，因此这个值在契约测试里不参与任何计算，保持原样。
uid = "（不适用：raw_response / variants 不含账号级字段；archive 见下）"

[fixture]
collectedAt = "2026-08-13"
sanitized = "true"
sanitizedBy = "主进程手工裁样 + 脱敏，随后过 gs-sanitize 复核 + 六项正向核对"

# ============================================================
# ★ 已知未验证项：API 的 Time 线格式
# ============================================================
#
# 本目录的 Time 用 ISO 8601（`2099-01-01T00:00:00`），**但这不是已验证的
# API 线格式**，而是本地存档的形状。查证过程：
#
#   - WWGachaExport 的 Models/GachaData.cs:18 里 `Time` 是 **DateTime 强类型**，
#     不是 string——API 发来的线格式在反序列化那一刻就被吃掉了。
#   - 存档里的 ISO 格式是 Newtonsoft 序列化 DateTime 的默认产物，反推不出
#     API 到底发的什么。
#   - 该工具反序列化 API 响应时设了 DateFormatString = "yyyy/MM/dd hh:mm:ss"
#     （斜杠分隔），暗示 API 可能发斜杠格式；但 Newtonsoft 的 DateFormatString
#     在**反序列化**路径上基本不起作用，这条证据不足以定论。
#   - docs/_internal/capture/ 下没有鸣潮抓包；research/03 §3.1 的样本是**存档**
#     结构不是 API 响应，同样证明不了。
#
# 为什么这件事必须显式记下来：record_key = hash(时间 + 物品 + 序位)。若 key
# 直接哈希原始时间字符串而我们猜错了线格式，fixture 测试会**全绿**，但首次
# 真实采集产出的 key 与预期全不相同——不报错，只会全量重复入库。
#
# 应对：插件的 deriveRecordKeys **先把时间规范化再哈希**，让 key 与线格式
# 无关。variants/pool_1_slash_time.json 就是这条保护的机械验证——它与
# 1_page_1.json 是同一批记录、只把时间换成斜杠写法，两者产出的 key 数组必须
# 逐项相同。

