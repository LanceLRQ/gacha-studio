# ============================================================
# archive/ 目录 —— 本地存档形状（GameUser），M2-S6 交换格式适配器的夹具
# ============================================================
#
# 与上面 raw_response/ 的关系是本目录的核心不变量，必须显式记录：
# `archive/wwgacha_archive.json` 的记录与 `raw_response/pool_1.json`、
# `raw_response/pool_10.json` **是同一批记录的不同形状**，这是刻意的——
# 后续会有测试断言「同一批记录走采集路径（读 raw_response，模拟 API 响应）
# 与走导入路径（读 archive，模拟本地存档导入）算出的 record_key 完全相同」。
# 两个目录不是两份独立样本，是同一批记录的两种投影。
#
# 本目录**没有重新接触任何真实存档**——生成方式是对已脱敏的
# raw_response/pool_1.json（17 条）与 pool_10.json（6 条）做机械字段变换，
# 脚本见下，全程只读这两个已入库文件。
#
# 转换规则（KRAPIItem → GachaData，字段形状分野见上方「第一版建模错了」）：
#   - camelCase → PascalCase 重命名：cardPoolType→CardPoolType /
#     resourceId→ResourceId / qualityLevel→QualityLevel /
#     resourceType→ResourceType / name→Name / count→Count / time→Time
#   - 类型原样保留（数字仍是数字，字符串仍是字符串）——不做字符串化，
#     这是 AUDIT-2026-08-12-M2鸣潮真实存档实测.md §2.1 实测纠正过的点
#   - 补 `"CardPoolId": null`：对应真实存档 93.1%（3139/3371）的形态
#     （§2.2）；本目录选择让 100% 记录都是 null，因为非空的 232 条其
#     取值全库去重后只有 1 个 hash 字符串，携带该值没有额外测试价值，
#     反而多一处需要脱敏的表面
#   - 每池顺序反转：raw_response 是 API 响应的倒序（新→旧），存档是正序
#     （旧→新）——参考实现取回 API 数据后调 apiData.Data.Reverse() 才落盘
#   - 顶层 GachaPoolData 固定 13 个槽位（PoolType 1..13）：PoolType=1 装
#     转换后的 pool_1 记录，PoolType=10 装转换后的 pool_10 记录，**其余
#     11 个槽位是空数组 `[]`**——真实存档的形态是固定槽位、空池为空数组
#     而非缺失键（§2.4），适配器必须能正确跳过而不是假设槽位非空
#
# 转换脚本（一次性，未入库，跑在会话临时目录）自校验了以下断言，全部通过：
#   - 池 1 / 池 10 转换后条数与源文件一致（17 / 6），其余 11 池为空数组
#   - 每条记录字段集合与顺序恰好等于 GachaData.cs 声明顺序（8 字段）
#   - 反转确实发生：archive 每池首条 == 对应 raw_response 该池末条（反之亦然）
#   - CardPoolId 全部为 JSON null；ResourceId/QualityLevel/Count 为数字类型
#   - UID/ServerID/ServerArea 恰好等于脚本内写死的字面占位值
#
# 顶层账号字段是**占位值，不来自任何真实数据**：
#   - UID = 100000000（数字类型，AUDIT §2.1 实测纠正——不是字符串；取值沿用
#     fixtures/genshin/meta.toml 已有的假 UID 惯例，也是 gs-sanitize 的
#     uid-field 规则本身的占位常量——见下方 ① 的幂等性说明，选它而不是随手
#     写一个数字，是为了让「--write 重跑不改字节」这条断言成立）
#   - ServerID = "fixture-server-id"
#   - ServerArea = "fixture-server-area"
# 三者均为脚本内字面量硬编码，脚本从未读取过 raw_response 之外的任何文件。
#
# ⚠️ **过程记录，不静默改掉**：本目录第一版把 UID 写成 900000001（当时的
# 直觉是"一眼可见是假的"），跑 --write 幂等性实测时发现它会被 uid-field
# 规则**改写**成 100000000（规则替换的是它自己的固定占位常量，不是"原样
# 保留输入值"）——即第一版的 UID 在 --write 下**不是幂等的**，dry-run 报告
# 的"命中"与"数据不变"之间存在落差，若不实测这条差异不会被发现。改用
# 100000000 后重新实测，--write 对两个文件均写回 0 个文件、字节不变。
# 与本文件多处"先实测再下结论"的记录方式一致，不覆盖这条修正过程。

[[samples]]
path = "archive/wwgacha_archive.json"
count = 23
note = """
GameUser 形状的本地存档（PascalCase，三层嵌套）。由 raw_response/pool_1.json
（17 条）与 pool_10.json（6 条）机械转换而来，共 23 条，规则见上方目录说明。
13 个槽位全部存在，PoolType=1 与 10 有数据，其余 11 个为空数组。
"""

