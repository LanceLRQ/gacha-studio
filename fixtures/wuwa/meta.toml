`packages/gs-plugin-kit/testkit/index.ts` 的 `parseResponseFileName`
（"<bannerId>_page_<n>[_后缀].json"），本文件原名 pool_1.json，2026-08-13
随 M2-S6 之后的 testkit 对齐修复改名，理由见下方「testkit 模型不一致」一节。

刻意选中真实存档里最难的几种情形：
  - 同秒同物品 5 连碰撞组 ×1 —— 全库最大的碰撞组，组内记录逐字段完全相同，
    只能靠序位区分
  - 十连组 ×1（10 条同秒记录）—— 十连天然同秒，是碰撞的主要来源
  - 5★ 记录 ×2
数组顺序为**倒序**（最新在前），与真实 API 一致；参考实现取回后用
apiData.Data.Reverse() 翻成正序才使用，本地存档存的是翻转后的正序。
