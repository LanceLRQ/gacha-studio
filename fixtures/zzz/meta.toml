# 绝区零插件 fixture 元信息。
#
# ⚠️ 与 fixtures/genshin/ 的性质不同：原神那套是手工构造、从未接触真实账号
# 数据；本目录 raw_response/ 下除 103_page_1.json 外，全部**裁自真实抽卡存档**
# （本地脱敏样本，5225 条中选取 19 条），因此脱敏不是走过场，零命中也不构成
# 安全证明——见文末「脱敏验证」一节，与 fixtures/wuwa/meta.toml 记录的同类
# 教训一致。

[game]
id = "zzz"
displayName = "绝区零"
apiVersionNote = """
raw_response/*.json 模拟的是 GET .../common/gacha_record/api/getGachaLog 的
响应形状：{ retcode, message, data: { list: [...], region } }，与原神完全
同构（已用 zzz-signal-search-export/src/main/getData.js:203-204 核实）。
data 元素对齐真实存档 + getData.js:477-478 双来源确认一致的 9 键结构
（id/item_id/item_type/name/rank_type/time/gacha_id/gacha_type/count），
本目录在此基础上补回了存档丢弃的 uid/lang 两键，凑齐 API 响应的 11 键。
"""

[account]
# 假 UID，与 fixtures/genshin/meta.toml、fixtures/wuwa/meta.toml 的占位惯例
# 一致；不是真实账号 UID（真实 UID 从未写入本目录任何文件，见下方脱敏说明）。
uid = "100000000"
region = "prod_gf_cn"

[fixture]
collectedAt = "2026-08-14"
sanitized = "true"
sanitizedBy = "主进程手工裁样 + 脚本化脱敏，随后过 gs-sanitize 复核 + 正向逐项核对"
note = """
raw_response/ 下 5 个文件中，4 个（2_page_1/2/3_empty、5_page_1）裁自真实
抽卡存档（本地脱敏样本，未入库、未复制进仓库），覆盖：
  - gacha_type=2（独家频段）两页 + 一页空列表，验证分页与终止条件
  - rank_type="4"（S 级，最高档，不是 "5"）——RaritySpec 抽象的核心验证点
  - item_type="邦布"——第三类物品分类
  - gacha_id 恒为 "0"（真实存档全量记录实测一致）
  - data.region="prod_gf_cn" 且响应信封不含 region_time_zone字段
    （后者是客户端查表算出来再写回本地存档的派生值，不是 API 原始字段，
    见 manifest.ts 里 time.timezoneSource 旁的说明）
第 5 个文件（103_page_1.json）**不是真实样本**，见下方「已知未验证项」。
"""

# ============================================================
# ★ 已知未验证项（不冒充已验证结论）
# ============================================================
#
# 1. 103（音擎回响）无真实样本，形态为类比构造
#    --------------------------------------------------------
#    真实存档里 gacha_type=103 是 **0 条记录**（已用脚本核实：对存档
#    result 数组按 gacha_type 分组统计，103 对应的分组长度为 0）。
#    raw_response/103_page_1.json 的 3 条记录是**人工构造**，形态照抄同族
#    音擎池（gacha_type=3，真实有数据）观测到的记录结构；item_id/name 借用
#    了 gacha_type=3 真实出现过的道具名称（音擎名称是游戏内容，不是账号
#    数据，因此不算敏感信息复用），但 id/time 是构造值、不对应任何真实抽取
#    事件。为便于日后区分，103 记录的 id 用 "29" 前缀（真实裁样记录统一用
#    "19" 前缀），两者不会混淆。
#
# 2. 102（独家重映）/103（音擎回响）与 2/3 的保底共享关系未确证
#    --------------------------------------------------------
#    manifest.ts 的 pityGroups 把 102/103 各自建成独立分组，**不是**已验证
#    结论——官方保底概率公示页用的是另一套内部编号，与抽卡记录 API 的
#    gacha_type 对不上，无法直接比对；第三方 wiki 称 102/103 是独立保底但
#    没有官方确认。按独立处理是保守选择，若后续证实 102/103 与 2/3 实际
#    共享保底计数，需要合并对应 PityGroup 的 members。
#
# 3. 响应记录里卡池字段的键名是旁证，非绝区零的直接实测
#    --------------------------------------------------------
#    查询参数名已确认改成了 real_gacha_type（zzz-signal-search-export
#    getData.js:202），但响应记录元素里对应字段是否也叫 real_gacha_type、
#    还是仍是 gacha_type，research/03、04 与本地存档均未直接证明——存档是
#    经工具再序列化过的产物，字段名可能被工具统一改写。manifest.ts 的
#    extractRecord 按 record.gacha_type 读取，最强依据是 HoYo.Gacha
#    crates/url_scraper/src/types.rs:80-90 的 GachaLog.gacha_type 字段
#    （四款米哈游游戏共用同一个反序列化目标，doc comment 没有为绝区零留任何
#    字段名特例），但这是旁证，不是直接抓包/实测绝区零某一条真实响应报文
#    得出的结论，如实标注在此，manifest.ts 里 bannerId 字段旁有同一份说明。
#
# 4. credential/data_2.sample 是手写文本近似，不是真实缓存字节
#    --------------------------------------------------------
#    与 fixtures/genshin/credential/data_2.sample 同一性质：真实 data_2 是
#    Chromium 二进制块文件格式，本文件是可读文本近似，只用于证明
#    manifest.ts 的 urlPattern 正则能在「Rust 侧已从缓存中抽取出的文本」上
#    命中一次真实形态的请求 URL，不代表已经拿到并解析过绝区零真实的
#    data_2 二进制文件。URL 本身的查询参数取自 manifest.ts 引用的官方接口
#    路径 + real_gacha_type/end_id 等已核实参数名，外加
#    packages/gs-plugin-kit/manifest.ts 文档提到的 init_log_gacha_base_type
#    （该参数名来自本项目既有 SDK 文档引用，不是本次新查证），authkey 是
#    FAKE_AUTHKEY_FOR_FIXTURE_ONLY 占位值，不是真实凭据。

