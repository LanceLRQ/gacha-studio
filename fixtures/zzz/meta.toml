# ============================================================
# ⚠️ 不要对本目录跑 `pnpm gs:sanitize fixtures/zzz/ --write`
# ============================================================
#
# 已在临时目录实测确认（未落到本目录任何真实文件）：`--write` 会把本目录
# 全部 "19xxxxxxxxxxxxxxxxx" / "29xxxxxxxxxxxxxxxxx" 序号 id **无差别替换成
# 同一个固定占位值 "1000000000000000000"**（gs-sanitize.mjs 的 long-numeric-id
# 规则本身的规范占位符，见该规则定义旁注释）——这与
# fixtures/wuwa/meta.toml 记录过的"UID 900000001 在 --write 下被改写成
# 100000000，并不幂等"是同一类问题，但后果更重：本目录的样本刻意让每条
# 记录持有互不相同的 id（用于验证 record_key 的唯一性），若真的跑
# --write，全部记录的 id 会坍缩成同一个值，`hooks.deriveRecordKey`
# 算出的 record_key 会跟着大量撞键（同一 bannerId 下的记录全部变成
# 同一个 recordKey），expected/normalized.json 里逐条不同的 recordKey
# 断言会集体失败——不是"改了个无关紧要的占位符"，是直接破坏本目录测的
# 东西。这与 genshin 用 "1400000000000000010" 这类非规范占位符的做法是
# 同一种设计取舍（保留分辨度 vs 追求 --write 幂等），genshin 同样没有
# 也不应该对自己的 fixture 跑 --write。dry-run 本身是安全的（只读、不
# 修改文件），仅 --write 需要避免。

# ============================================================
# 脱敏验证（两道，缺一不可）—— 覆盖全部 6 个入库样本文件
# ============================================================
#
# ① gs-sanitize 扫描：见任务报告里贴出的真实命令输出（本文件不复述工具
#    输出本身，只记录判断依据）。
#
# ② 正向逐项核对：**零命中不构成安全证明**，本项目已经在 M2 鸣潮 fixture
#    上踩过一次真实的坑（早期规则对含 9 位 UID 的样本报告零命中，是假阴性
#    不是安全证明），本目录同样不能只看 gs-sanitize 的报告就收尾。逐项确认
#    真实值不在文件里的方法是「新文件字段值是否恰好等于我写入的占位字面
#    量」——因为裁样脚本自始至终只从本地真实存档读取 id/item_id/item_type/
#    name/rank_type/time/count/gacha_id/gacha_type 九个字段，从未读取过真实
#    UID、真实 authkey、任何账号级标识：
#      - 全部 19 条真实裁样记录的 uid 字段 === "100000000"（脚本写入的
#        固定占位值，逐条核对，不是"大概率不是真实值"）
#      - 全部 19 条真实裁样记录的 id 字段匹配 "19" + 17 位数字的构造模式
#        （脚本按真实记录出现顺序从 1900000000000000001 依次递增编号，
#        与真实存档里的 19 位雪花 ID 在数值上完全无关，只是位数凑够 19 位
#        这一形状特征保留了下来）
#      - 全部 3 条 103 构造记录的 id 字段匹配 "29" + 17 位数字模式，同样是
#        脚本生成的序号，不对应任何真实事件
#      - 全部 22 条记录的 time 字段日期部分落在 2099-01-01～2099-01-09
#        区间（脚本按"首次出现的真实日期"顺序映射到这个虚构基准，时分秒
#        原样保留以维持"同一批次同秒"的分组结构，但日期已与真实游玩时间
#        无关）
#      - lang 字段固定为 "zh-cn"：与真实存档取值相同，但该字段本身是游戏
#        客户端语言设置，不是账号标识，比照 fixtures/genshin/meta.toml 对
#        同一字段的处理方式，不需要额外脱敏
#      - item_id / name / item_type / rank_type / count / gacha_id 五个
#        字段直接保留真实存档原值——它们是游戏内容（道具目录 ID、道具名、
#        分类、稀有度、数量、恒定值），不是账号数据，不在脱敏范围内
#      - credential/data_2.sample 的 authkey 参数值为字面量
#        "FAKE_AUTHKEY_FOR_FIXTURE_ONLY"，不含任何真实签名片段
#    结果：6 个入库文件 × 以上逐项核对全部通过。

# ============================================================
# archive/ 目录 —— UIGF v4.x 交换格式适配器的夹具
# ============================================================
#
# 与上面 raw_response/ 的关系、生成方式（顺序反转 + 字段改名 + 脚本一次性
# 跑在会话临时目录未入库）与 `fixtures/genshin/meta.toml` archive/ 一节
# 完全同一思路，这里只记录绝区零特有的差异点：
#
#   - 源文件是 `raw_response/2_page_1.json`（6 条，gacha_type=2，独家
#     频段）——与 record_key 测试组共用同一份"已核实为 API 真实倒序"的样本
#   - `gacha_id` 直接取 raw_response 的取值 `"0"`（真实存档全量记录实测
#     恒为该值），不是走 `UigfNapItem.gacha_id: Option` 缺省补 "0" 那条
#     兜底路径——本文件里这个字段是显式声明的，兜底路径由
#     `crates/gs-exchange/src/uigf.rs` 的单元测试
#     `import_restores_zzz_record_defaulting_missing_gacha_id_to_zero`
#     单独用一份不含 `gacha_id` 键的合成 JSON 覆盖，不依赖这份 fixture
#   - `item_id`/`rank_type` 与星铁同理，直接取 raw_response 原始取值
#   - `uid`/`timezone`/`lang` 取 `"100000000"`/`8`/`"zh-cn"`——绝区零响应
#     信封本身不带 `region_time_zone`（时区来自 `region` 字段查静态表，
#     见 `plugins/zzz/manifest.ts`），`timezone: 8` 对应 `region:
#     "prod_gf_cn"` 在该静态表里的取值（`prod_gf_cn: 8`）
#
# ⚠️ 与星铁同理，绝区零 `timezoneSource: staticTable` 也需要页级响应体
# （`region` 字段），UIGF 存档没有这个字段，导入路径会在 `gs-host` 层
# fail closed——见 `crates/gs-host/src/import.rs` 模块文档"已知缺口"一节，
# 完整分析不在本目录重复。
#
# 脱敏验证：本目录未接触任何新的真实数据（只读取已入库、已通过脱敏验证的
# `raw_response/2_page_1.json`）。`node scripts/gs-sanitize.mjs
# fixtures/zzz`（dry-run）对新增文件命中 0 处。**同样不要对本文件跑
# `--write`**——理由与上方"不要对本目录跑 --write"一节相同：本文件的雪花
# ID 沿用 raw_response 的 "19" 前缀序号，会被 long-numeric-id 规则坍缩成
# 同一个占位值，破坏逐条记录 id 互不相同这条前提。
#
# 具体脱敏手法：
#   - 账号级字段仅保留 uid（占位值 100000000）与 lang（非敏感），未出现
#     authkey、设备 ID、cookie、token 等其余凭据字段
#   - 雪花 ID 全部替换为脚本生成的序号（19 位数字形状保留，数值与真实值
#     无关），真实裁样与人工构造两类分别用 "19"/"29" 前缀区分
#   - 时间整体映射到 2099 年虚构基准，保留同批次同秒的分组结构，抹去真实
#     游玩时刻
#   - 未复制、未提交任何原始存档文件到本仓库
