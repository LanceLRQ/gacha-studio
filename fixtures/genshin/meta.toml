# 原神插件 fixture 元信息。
#
# 本目录下的全部样本均为手工构造的脱敏数据，不来自任何真实账号或真实存档。
# UID、authkey、雪花 ID 一律使用一眼可辨的假值，字段形状参照以下资料校准：
#   - docs/_internal/research/03-真实导出数据格式实测.md §一、§二
#   - docs/_internal/research/04-同族工具三方源码对比.md §4.1～§4.9
#   - docs/example-projects/genshin-wish-export/src/main/getData.js
#   - docs/example-projects/HoYo.Gacha/crates/url_scraper/src/types.rs

[game]
id = "genshin"
displayName = "原神"
apiVersionNote = "getGachaLog 字段形状，参照 HoYo.Gacha 6.6 前的 GachaLog 结构（不含 item_id）"

[account]
# 假 UID，首位数字 "1" 落在 resolveTimezone 的默认分支（非 6/7），期望时区偏移为 UTC+8。
uid = "100000000"
region = "cn_gf01"

[fixture]
collectedAt = "2026-08-10"
sanitized = "true"
sanitizedBy = "gs-sanitize（手工构造，未经过真实抓取，无需脱敏但仍过了一遍工具确认零命中）"
note = "覆盖三个场景：301 分组混有 gacha_type=400 的记录、rank_type 为空字符串需归一化为 undefined、至少一条五星记录。全部样本数据由人工按研究文档记录的字段形状手写构造。"
# ⚠️ 上面 sanitizedBy 的"过了一遍 gs-sanitize 确认零命中"这句话，适用范围仅限于
# 本目录这种手工构造、从未接触过真实账号数据的 fixture——对这类文件，零命中
# 本身就是预期结果（本来就没有敏感值可脱）。
#
# 对从真实存档裁出的 fixture（如 M2 鸣潮），零命中不构成安全证明，只是"这版
# gs-sanitize 规则集没匹配上"——AUDIT-2026-08-12-M2鸣潮真实存档实测.md §四
# 记录过一次真实案例：early 版本的 gs-sanitize 对含 9 位 UID 与 32 位十六进制
# ServerID 的合成鸣潮结构样本报告零命中，是规则集下限定得太窄（19 位数字），
# 不是数据本身干净。真实数据派生的 fixture 除了跑 gs-sanitize，还须另有
# 「已知敏感字段清单逐项确认」的正向检查（逐个核对 UID/authkey/ServerID 等
# 已知敏感字段确实被替换成了占位值，而不是仅凭工具报告"0 处命中"就下结论）。
