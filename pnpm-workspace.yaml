packages:
  - web
  - packages/*
  - plugins
  - plugins/*
  # M1-S7 纸面填表演练草稿（星铁/绝区零 manifest 草稿）。只有一份
  # drills/package.json（星铁/绝区零草稿是同一个包内的两个子目录，不像
  # plugins/<game> 那样各自独立成包，因此不需要 drills/* 这条 glob）。
  # 刻意与 plugins* 分开声明——scripts/gs-bundle-plugins.mjs 只扫 plugins/
  # 目录发现插件，drills/ 不会被打进构建产物，详见 drills/README.md。
  - drills

# 共享依赖的单一版本源。各包写 "catalog:" 引用，避免版本在多处漂移
# —— 插件数量会随里程碑增长，每个插件一份 package.json，分散声明必然失同步。
catalog:
  # ⚠️ 2026-08-18 更正：本条原先写的锁定理由**不成立**，已重写。
  #
  # 原文称「typescript-eslint 的 peer 要求为 >=4.8.4 <6.1.0，TS 7 尚未提供稳定的
  # programmatic API，导致 typescript-eslint 无法工作。本项目的 lint 承担 HC-1
  # 静态检查职责，属安全基础设施，不可缺」。逐条核实后三处都对不上：
  #   ① **全仓没有 eslint**——没有任何 eslint 配置文件，没有 eslint 依赖，
  #      也没有任何包声明 `lint` 脚本。为一个不存在的依赖付版本锁定的代价。
  #   ② **HC-1 不是 typescript-eslint 做的**——它是
  #      `scripts/gs-check/checks/no-dynamic-import.mjs`，一个对
  #      `plugins/**/*.ts` 做文本扫描的自研脚本，**根本不 import `typescript`**。
  #   ③ 全仓 `scripts/` 下没有任何地方使用 TypeScript 的 programmatic API
  #      （无 `createProgram`/`createSourceFile`/`ts-morph`），所以「TS 7 缺稳定
  #      programmatic API」这件事对本仓库当前用法不构成障碍——`typescript` 在
  #      这里的唯一用途是 `tsc --noEmit`（根 `package.json` 的 `typecheck`）。
  #
  # 现在为什么仍然锁在 6.x：**只是还没有验证过 TS 7**。TS 7 是 Go 重写的
  # 新实现，`tsc --noEmit` 在本仓库这套配置（`verbatimModuleSyntax` +
  # `noUncheckedIndexedAccess` + `isolatedModules` + Bundler 解析）下行为是否
  # 一致尚未实测。这是「未验证」，不是「有已知阻塞」——两者不该用同一句话
  # 描述，前者是可以安排的一次验证，后者会让人以为此路不通而不再尝试。
  # 升级前请实测，不要仅凭本注释放行。
  typescript: ^6.0.3
  zod: ^4.4.3

  # M1-S6 界面层：版本与 docs/_internal/design/2026-08-10-界面设计方向.md §2
  # 的实测记录一致（Tailwind 4.3.3 / lucide-react 1.31.0），仅 web/ 一个包
  # 使用，但同样走 catalog——避免后续新增 web 子包（如独立组件库）时漂移。
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  lucide-react: ^1.31.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  # 聚合包，按需具名导入各 Radix 原语（如 `import { Dialog } from "radix-ui"`），
  # 免去逐个声明 @radix-ui/react-* 单独包版本——shadcn CLI 4.16.2 的
  # nova 预设本身即采用这一方式（详见 web/src/components/ui/button.tsx）。
  radix-ui: ^1.6.7
  react-router-dom: ^7.18.2
  # 前端调 invoke() 的唯一途径（另一条路是开 withGlobalTauri，那会把整个
  # Tauri API 挂到 window 上，与 HC-2「能力窄口」的方向相反）。
  # ⚠️ 需与根 package.json 的 @tauri-apps/cli 保持同一 minor：二者共用同一套
  # IPC 协议，cli 升级后 api 不跟会在运行时报「命令不存在」这类难查的错，
  # 而不是编译期失败。
  "@tauri-apps/api": ^2.11.1

  # 西文字体自托管（拉丁子集，5 个字重实测 120KB）。中文不打包，
  # 由 --font-ui 兜底链回落系统字体，见 web/src/styles/theme.css。
  "@fontsource/ibm-plex-sans": ^5.3.0
  "@fontsource/jetbrains-mono": ^5.3.0
  # vite.config.ts 用 node:url 解析路径别名，是 Vite + TS 项目的标准写法。
  "@types/node": ^22.20.1
