[workspace]
resolver = "3"
members = [
    "crates/gs-core",
    "crates/gs-storage",
    "crates/gs-analysis",
    "crates/gs-host",
    "crates/gs-plugin-runtime",
    "crates/paradigms/gs-p-authkey",
    "crates/paradigms/gs-p-uigf",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# 跨 crate 共享的依赖统一在此声明版本，各 crate 通过 `xxx.workspace = true` 引用，
# 避免同一依赖在不同 crate 里出现版本漂移。
# 只收录确实被多个 crate 使用的公共依赖；单个 crate 专属的依赖（如 gs-storage 的
# rusqlite、src-tauri 的 tauri）直接写在各自的 Cargo.toml 里，不进这张表。
[workspace.dependencies]
gs-core = { path = "crates/gs-core" }
gs-storage = { path = "crates/gs-storage" }
gs-analysis = { path = "crates/gs-analysis" }
gs-host = { path = "crates/gs-host" }
# 插件 JS 运行时桥接：gs-host 与各 L1 范式层（如 gs-p-authkey）平级依赖它，
# 它不反过来依赖任何一个消费者——理由见 crates/gs-plugin-runtime/src/lib.rs
# 顶部「为什么是独立 crate」一节（破解 gs-host ⇄ gs-p-authkey 的必然环）。
gs-plugin-runtime = { path = "crates/gs-plugin-runtime" }
gs-p-authkey = { path = "crates/paradigms/gs-p-authkey" }
gs-p-uigf = { path = "crates/paradigms/gs-p-uigf" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# TS 类型生成：gs-core 定义类型、gs-host 的 gs-codegen 二进制显式导出，
# 详见 crates/gs-host/src/bin/gs-codegen.rs 顶部说明。
ts-rs = "12"
