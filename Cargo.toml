[workspace]
resolver = "3"
members = [
    "crates/gs-core",
    "crates/gs-storage",
    "crates/gs-analysis",
    "crates/gs-host",
    "crates/gs-manifest-data",
    "crates/gs-plugin-runtime",
    "crates/paradigms/gs-p-authkey",
    "crates/gs-exchange",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# 跨 crate 共享的依赖统一在此声明版本，各 crate 通过 `xxx.workspace = true` 引用，
# 避免同一依赖在不同 crate 里出现版本漂移。
# 只收录确实被多个 crate 使用的公共依赖；单个 crate 专属的依赖（如 gs-storage 的
# rusqlite、src-tauri 的 tauri）直接写在各自的 Cargo.toml 里，不进这张表。
[workspace.dependencies]
gs-core = { path = "crates/gs-core" }
gs-storage = { path = "crates/gs-storage" }
gs-analysis = { path = "crates/gs-analysis" }
gs-host = { path = "crates/gs-host" }
# manifest 纯数据 JSON 的只读访问入口，不依赖 JS 运行时：gs-plugin-runtime
# 与 gs-analysis 平级依赖它，它不反过来依赖任何一个消费者——理由见
# crates/gs-manifest-data/src/lib.rs 顶部「为什么从 gs-plugin-runtime 里
# 单独拆出来」一节。
gs-manifest-data = { path = "crates/gs-manifest-data" }
# 插件 JS 运行时桥接：gs-host 与各 L1 范式层（如 gs-p-authkey）平级依赖它，
# 它不反过来依赖任何一个消费者——理由见 crates/gs-plugin-runtime/src/lib.rs
# 顶部「为什么是独立 crate」一节（破解 gs-host ⇄ gs-p-authkey 的必然环）。
gs-plugin-runtime = { path = "crates/gs-plugin-runtime" }
gs-p-authkey = { path = "crates/paradigms/gs-p-authkey" }
# 交换格式适配层：识别并导入第三方工具产出的抽卡存档（如鸣潮参考项目
# WWGachaExport 的本地 JSON 存档、UIGF v4.x 交换文件），产出本项目能消费的
# 中间形状。依赖 gs-core，不被 gs-core 依赖，不属于采集流程
# （`CollectConfig` 判别联合的任何一个分支）。
#
# UIGF 适配器（`gs_exchange::uigf`）落在这里，而不是独立的
# `gs-p-uigf`——`crates/paradigms/gs-p-uigf` 曾经是一个 31 行的版本号判定
# 桩（零字段映射、零依赖、零消费者），随 UIGF v4 真实实现落地一并删除。
# 删除理由：`gs-exchange` 已经是"识别/导入任意第三方存档"的通用框架，
# UIGF 与 wwgacha 是同一个 trait（`ExchangeAdapter`）下的两个平级实现，
# 单独拆一个只装得下"其中一种格式"的 crate 不会带来任何隔离收益，只会多
# 一层没有必要的 crate 边界。若在别处（旧文档、旧讨论记录）看到
# "gs-p-uigf" 字样，一律是这次删除之前的旧模型残留。
gs-exchange = { path = "crates/gs-exchange" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# TS 类型生成：gs-core 定义类型、gs-host 的 gs-codegen 二进制显式导出，
# 详见 crates/gs-host/src/bin/gs-codegen.rs 顶部说明。
ts-rs = "12"
