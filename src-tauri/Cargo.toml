[package]
name = "gacha-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gacha Studio 桌面壳层（Tauri 宿主）"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gacha_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gs-host.workspace = true
# backfill_pending_metadata 命令要按插件维度枚举"哪些插件声明了在线元数据
# Provider"（gs_analysis::online_metadata_request_for）并遍历全部已注册插件
# id（gs_analysis::registered_plugin_ids）——gs-host 已经依赖 gs-analysis，
# 但同样不能只靠传递依赖使用它，理由同上面 gs-storage 那条注释。
gs-analysis.workspace = true
# online_metadata_request_for 返回 gs_core::RequestTemplate，本文件需要按
# 名字引用这个类型（resolve_dictionary_for_lang 的参数类型），同样不能只靠
# gs-analysis/gs-host 的传递依赖使用它。
gs-core.workspace = true
gs-plugin-runtime.workspace = true
# list_records 的筛选条件要装进 gs_storage::RecordFilter 传给 gs-host——
# gs-host 已经依赖 gs-storage，但 Rust 不允许只靠传递依赖使用一个 crate，
# 这里必须显式声明。
gs-storage.workspace = true
tauri-plugin-dialog = "2.7.2"
# ensure_game_icon 命令把 gs_host::icon_cache::CachedIcon 的字节编码成 data
# URL 字符串——已经是 Cargo.lock 里 tauri-codegen/reqwest 的传递依赖（锁定
# 0.22.1），这里升级为直接依赖。base64 编码属于"给前端的 wire 格式"这一层
# 的翻译工作，因此放在 src-tauri 而不是 gs-host——同一分工原则见本文件
# commands.rs 头部"这一层做什么"的说明。
base64 = "0.22"
